<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ことば道 N2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#2e6bf6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1420" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ことば道">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: Busuu-like learning app — left nav, course path in the middle, stats rail on the right; lesson player is a full-screen sheet with a check bar. */
:root{
  --bg:#f3f6fb; --surface:#ffffff; --sunk:#eef2f8; --ink:#17212f; --muted:#5f6c82; --line:#dfe5ef;
  --brand:#2e6bf6; --brand-ink:#ffffff; --brand-soft:#e4ecff; --brand-deep:#1f4fc4;
  --good:#16a874; --good-soft:#ddf5ea; --bad:#e5475a; --bad-soft:#fde6e9; --sun:#ff9f1a;
  --u1:#2e6bf6; --u2:#0e9c9c; --u3:#e2557a; --u4:#3a9d3a; --u5:#d98a06;
  --shadow:0 1px 2px rgba(23,33,47,.06),0 4px 14px rgba(23,33,47,.06);
  --f-ui:"Nunito","PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --f-jp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1420; --surface:#171f2e; --sunk:#111926; --ink:#e7edf7; --muted:#97a3b9; --line:#263248;
  --brand:#5b8dff; --brand-ink:#0b1430; --brand-soft:#1c2a4b; --brand-deep:#8eb0ff;
  --good:#3ccf97; --good-soft:#12352a; --bad:#ff6f80; --bad-soft:#3b1b22; --sun:#ffb347;
  --u1:#6b97ff; --u2:#2cc4c4; --u3:#ff7c9c; --u4:#64c564; --u5:#f0aa33;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1420; --surface:#171f2e; --sunk:#111926; --ink:#e7edf7; --muted:#97a3b9; --line:#263248;
  --brand:#5b8dff; --brand-ink:#0b1430; --brand-soft:#1c2a4b; --brand-deep:#8eb0ff;
  --good:#3ccf97; --good-soft:#12352a; --bad:#ff6f80; --bad-soft:#3b1b22; --sun:#ffb347;
  --u1:#6b97ff; --u2:#2cc4c4; --u3:#ff7c9c; --u4:#64c564; --u5:#f0aa33;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:10px}
.jp{font-family:var(--f-jp)}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
p{margin:0}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* shell */
.shell{display:grid;grid-template-columns:210px minmax(0,1fr) 290px;gap:32px;max-width:1220px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.side{position:sticky;top:calc(24px + env(safe-area-inset-top,0px));align-self:start;display:flex;flex-direction:column;gap:6px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.logo-mark{width:38px;height:38px;border-radius:12px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--f-jp);font-weight:700;font-size:20px}
.logo b{font-family:var(--f-jp);font-size:19px;display:block;line-height:1.1}
.logo small{font-size:11px;font-weight:800;color:var(--brand);letter-spacing:.1em}
.nav-btn{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;font-weight:800;color:var(--muted);text-align:left}
.nav-btn svg{width:22px;height:22px;flex:none}
.nav-btn:hover{background:var(--sunk);color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
main{min-width:0;display:flex;flex-direction:column;gap:22px}
aside{display:flex;flex-direction:column;gap:16px;position:sticky;top:calc(24px + env(safe-area-inset-top,0px));align-self:start}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.page-h{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-h h1{font-size:26px;font-weight:900}
.page-h p{color:var(--muted)}

/* stats */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:22px;font-weight:900}
.stat span{font-size:12px;color:var(--muted);font-weight:700}
.streak{display:flex;align-items:center;gap:14px}
.flame{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--sun) 18%,var(--surface));color:var(--sun)}
.flame svg{width:26px;height:26px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);font-weight:700}
.day i{width:24px;height:24px;border-radius:50%;background:var(--sunk);border:2px solid var(--line);display:grid;place-items:center}
.day.on i{background:var(--sun);border-color:var(--sun);color:#fff}
.day.today span{color:var(--ink)}
.goal{display:flex;align-items:center;gap:16px}
.ring{flex:none}
.ring circle{fill:none}
.ring .bgc{stroke:var(--sunk)}
.goal-txt b{font-size:20px;font-weight:900}
.goal-txt span{display:block;color:var(--muted);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{padding:5px 12px;border-radius:999px;border:1.5px solid var(--line);font-weight:800;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.strip{display:none}

/* continue card */
.hero{background:var(--brand);color:#fff;border-radius:20px;padding:22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;position:relative;overflow:hidden}
.hero::after{content:attr(data-glyph);position:absolute;right:-10px;bottom:-46px;font-family:var(--f-jp);font-size:170px;font-weight:700;line-height:1;opacity:.13;pointer-events:none}
.hero .eyebrow{color:rgba(255,255,255,.8)}
.hero h2{font-family:var(--f-jp);font-size:26px;margin-top:4px}
.hero p{opacity:.88;margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:14px;font-weight:900;font-size:15px;white-space:nowrap}
.btn-white{background:#fff;color:#1f4fc4;box-shadow:0 3px 0 rgba(0,0,0,.15);position:relative;z-index:1}
.btn-primary{background:var(--brand);color:var(--brand-ink);box-shadow:0 3px 0 var(--brand-deep)}
.btn-primary:disabled{background:var(--sunk);color:var(--muted);box-shadow:none;cursor:not-allowed}
.btn-ghost{border:2px solid var(--line);color:var(--ink)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:none}

/* units */
.unit{display:flex;flex-direction:column;gap:10px}
.unit-h{display:flex;align-items:center;gap:14px}
.glyph{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-family:var(--f-jp);font-weight:700;font-size:28px;flex:none;
  background:color-mix(in srgb,var(--uc) 15%,var(--surface));color:var(--uc)}
.unit-h h3{font-family:var(--f-jp);font-size:20px}
.unit-h p{color:var(--muted);font-size:13px;font-weight:700}
.unit-h .uprog{margin-left:auto;font-size:13px;font-weight:800;color:var(--muted)}
.lessons{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lrow{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;text-align:left;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow:hover{background:var(--sunk)}
.lrow .ri{position:relative;width:46px;height:46px;flex:none;display:grid;place-items:center}
.lrow .ri svg.ring{position:absolute;inset:0}
.lrow .ri .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--muted);font-weight:900;font-size:14px}
.lrow.done .ri .ic{background:var(--uc);color:#fff}
.lrow.next .ri .ic{background:color-mix(in srgb,var(--uc) 18%,var(--surface));color:var(--uc)}
.lrow .lt{min-width:0;flex:1}
.lrow .lt b{font-family:var(--f-jp);font-size:16px;display:block}
.lrow .lt span{color:var(--muted);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:12px;font-weight:900;padding:5px 11px;border-radius:999px;flex:none}
.tag-next{background:var(--brand);color:var(--brand-ink)}
.tag-done{background:var(--good-soft);color:var(--good)}
.tag-new{background:var(--sunk);color:var(--muted)}

/* review & grammar lists */
.wlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.witem{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.witem .wt{flex:1;min-width:0}
.witem .wt b{font-family:var(--f-jp);font-size:17px}
.witem .wt small{font-family:var(--f-jp);color:var(--muted);margin-left:6px}
.witem .wt span{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.str{display:flex;gap:3px}
.str i{width:6px;height:16px;border-radius:3px;background:var(--line)}
.str i.on{background:var(--good)}
.str.weak i.on{background:var(--sun)}
.say{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--brand);background:var(--brand-soft);flex:none}
.say svg{width:18px;height:18px}
.say:hover{filter:brightness(.96)}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px}
.gcard-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gcard-h h3{font-family:var(--f-jp);font-size:22px}
.gcard .m{font-weight:800}
.form{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:14px;background:var(--sunk);border-radius:10px;padding:8px 12px}
.form span:first-child{font-size:11px;font-weight:900;letter-spacing:.08em;color:var(--muted)}
.gex{display:flex;gap:10px;align-items:flex-start}
.gex div{min-width:0}
.gex p.jp{font-size:16px}
.gex p.zh{font-size:13px;color:var(--muted)}
mark{background:color-mix(in srgb,var(--brand) 18%,transparent);color:inherit;border-radius:4px;padding:0 3px}
.danger{color:var(--bad);font-weight:800;font-size:13px}

/* lesson player */
.lx{position:fixed;inset:0;z-index:50;background:var(--surface);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.lx-top{display:flex;align-items:center;gap:14px;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));max-width:760px;width:100%;margin:0 auto}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--sunk)}
.icon-btn svg{width:22px;height:22px}
.bar{flex:1;height:12px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--good);border-radius:99px;transition:width .35s ease}
.lx-count{font-weight:900;color:var(--muted);font-size:13px;min-width:44px;text-align:right}
.lx-body{flex:1;overflow-y:auto;padding-block:12px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ex{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:20px;animation:rise .28s ease}
@keyframes rise{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
.q{font-size:21px;font-weight:900}
.q .jp{font-weight:700}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:2px solid var(--line);box-shadow:0 2px 0 var(--line);font-weight:800;font-size:16px;background:var(--surface)}
.opt:hover:not(:disabled){background:var(--sunk)}
.opt .k{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted);flex:none}
.opt.jp{font-size:19px;font-weight:700}
.opt.sel{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 2px 0 var(--brand)}
.opt.sel .k{border-color:var(--brand);color:var(--brand)}
.opt.right{border-color:var(--good);background:var(--good-soft);box-shadow:0 2px 0 var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 2px 0 var(--bad)}
.opt:disabled{cursor:default}
.wcard{border:2px solid var(--line);border-radius:20px;padding:26px 22px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.wcard .word{font-family:var(--f-jp);font-size:46px;font-weight:700;line-height:1.2}
.wcard rt{font-size:15px;color:var(--muted);font-weight:500}
.wcard .mean{font-size:20px;font-weight:900;color:var(--brand)}
.wcard .exs{width:100%;text-align:left;background:var(--sunk);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:flex-start}
.wcard .exs div{min-width:0}
.wcard .exs p.jp{font-size:16px}
.wcard .exs p.zh{font-size:13px;color:var(--muted);margin-top:2px}
.wcard .exs b{color:var(--brand)}
.say-xl{width:96px;height:96px;border-radius:28px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;box-shadow:0 4px 0 var(--brand-deep);margin:0 auto}
.say-xl svg{width:44px;height:44px}
.say-row{display:flex;gap:14px;justify-content:center;align-items:center}
.say-slow{width:56px;height:56px;border-radius:18px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:900;font-size:12px}
.sent{font-family:var(--f-jp);font-size:21px;line-height:2.1;padding:18px;border-radius:16px;background:var(--sunk)}
.blank{display:inline-block;min-width:110px;border-bottom:3px solid var(--brand);text-align:center;color:var(--brand);font-weight:700;padding:0 6px;line-height:1.5}
.blank.empty-b{color:transparent}
.zone{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding-bottom:10px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{font-family:var(--f-jp);font-size:17px;font-weight:700;padding:9px 14px;border-radius:12px;border:2px solid var(--line);box-shadow:0 2px 0 var(--line);background:var(--surface)}
.tile.used{visibility:hidden}
.tile:disabled{cursor:default}
.match{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:1fr;gap:10px}
.mt{padding:12px 10px;border-radius:14px;border:2px solid var(--line);box-shadow:0 2px 0 var(--line);font-weight:800;background:var(--surface);min-height:64px;
  display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.35;overflow-wrap:anywhere}
.mt.jp{font-size:19px;font-weight:700}
.mt.sel{border-color:var(--brand);background:var(--brand-soft)}
.mt.ok{border-color:var(--good);background:var(--good-soft);color:var(--good);opacity:.65;cursor:default}
.mt.no{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.tip{border-radius:20px;background:var(--brand-soft);padding:22px;display:flex;flex-direction:column;gap:14px}
.tip h2{font-family:var(--f-jp);font-size:32px;color:var(--brand)}
.tip .m{font-size:18px;font-weight:900}
.tip .form{background:var(--surface)}
.tip .gex{background:var(--surface);border-radius:12px;padding:12px}

.lx-foot{border-top:2px solid var(--line);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--surface)}
.lx-foot.ok{background:var(--good-soft);border-color:transparent}
.lx-foot.no{background:var(--bad-soft);border-color:transparent}
.foot-in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap}
.fb{display:flex;gap:12px;align-items:center;min-width:0;flex:1}
.fb .bad-ic,.fb .ok-ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.fb .ok-ic{background:var(--good)} .fb .bad-ic{background:var(--bad)}
.fb .ok-ic svg,.fb .bad-ic svg{width:24px;height:24px}
.fb b{font-size:18px;font-weight:900;display:block}
.ok .fb b{color:var(--good)} .no .fb b{color:var(--bad)}
.fb p{font-size:14px;min-width:0}
.btn-good{background:var(--good);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--good) 70%,#000)}
.btn-bad{background:var(--bad);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--bad) 70%,#000)}
.foot-in .btn{min-width:150px}

.done-screen{text-align:center;align-items:center}
.nextcard{width:100%;display:flex;align-items:center;gap:14px;text-align:left;border:2px solid var(--line);border-radius:16px;padding:14px 16px}
.nextcard .lt{min-width:0;display:flex;flex-direction:column;gap:2px}
.nextcard .lt b{font-size:18px}
.nextcard .lt span:last-child{color:var(--muted);font-size:13px}
.choices{width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:10px}
.choices .btn{width:100%;padding-block:15px}
.badge{width:110px;height:110px;border-radius:32px;background:var(--good);color:#fff;display:grid;place-items:center;margin:20px auto 0;box-shadow:0 6px 0 color-mix(in srgb,var(--good) 70%,#000)}
.badge svg{width:56px;height:56px}
.done-screen h2{font-size:28px;font-weight:900}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.tiles div{border:2px solid var(--line);border-radius:16px;padding:14px 8px}
.tiles b{display:block;font-size:24px;font-weight:900}
.tiles span{font-size:12px;color:var(--muted);font-weight:800}
.sheet{position:absolute;inset:0;background:rgba(10,16,28,.45);display:grid;place-items:end center;z-index:5;padding:16px}
.sheet-card{background:var(--surface);border-radius:20px;padding:22px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:center;margin-bottom:env(safe-area-inset-bottom,0px)}
.sheet-card h3{font-size:19px;font-weight:900}
.sheet-card p{color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:800;z-index:80;max-width:calc(100% - 32px)}

@media (max-width:1100px){
  .shell{grid-template-columns:200px minmax(0,1fr)}
  aside{display:none}
  .strip{display:grid}
}
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr);padding-block:16px 100px}
  .side{position:fixed;top:auto;left:0;right:0;bottom:0;z-index:20;flex-direction:row;justify-content:space-around;gap:0;background:var(--surface);border-top:1px solid var(--line);

const TYPES={R:['漢字読み','汉字读音'],H:['表記','汉字书写'],K:['語形成','前缀・后缀'],C:['文脈規定','语境填空'],P:['言い換え類義','近义替换'],U:['用法','用法判断'],G:['文法形式','语法选择']};
const YF=y=>'20'+y.replace('.','年')+'月';
const EXV={};
(window.EXAM_V||'').trim().split('\n').forEach(line=>{
  const f=line.split('|');if(f.length<5)return;
  const [w,r,m,pos,tags,syn='',hk='',ex='',exz='']=f;
  const e=EXV[w]||(EXV[w]={w,r,m,pos,tags:[],syn:'',hk:[],ex:'',exz:''});
  tags.trim().split(/\s+/).forEach(t=>e.tags.push({t:t[0],y:t.slice(1)}));
  if(syn&&!e.syn)e.syn=syn;if(hk&&!e.hk.length)e.hk=hk.split(',');if(ex&&!e.ex){e.ex=ex;e.exz=exz}
});
const EXK=(window.EXAM_K||'').trim().split('\n').filter(Boolean).map(line=>{const [a,w,r,m,ys,d,ex='',exz='']=line.split('|');return {a,w,r,m,ys:ys.split(' '),d:d.split(','),ex,exz}});
const KMAP=Object.fromEntries(EXK.map(k=>[k.w,k]));
const EXG=(window.EXAM_G||[]).map(g=>({...g,ys:g.y.split(' ')}));
const GMAP=Object.fromEntries(EXG.map(g=>[g.id,g]));
const BASE_Y={'わけにはいかない':'13.7 18.7','に応じて':'10.7','ものの':'15.7','おそれがある':'17.7','たびに':'13.7'};
UNITS.forEach(u=>u.lessons.forEach(l=>{if(BASE_Y[l.g.k])l.g.ys=BASE_Y[l.g.k].split(' ')}));
(window.EXAM_UNITS||[]).forEach(u=>UNITS.push({glyph:u.glyph,title:u.title,zh:u.zh,c:u.c,exam:true,lessons:u.lessons.map(l=>{
  const g=GMAP[l.g];g.inLesson=true;
  return {title:l.title,zh:l.zh,words:l.w.split(' ').map(w=>{const e=EXV[w]||KMAP[w];return [w,e.r,e.m,e.ex,e.exz]}),
    g:{p:g.p,k:g.k,m:g.m,f:g.f,ex:g.ex,order:g.order,ys:g.ys}}})}));

let lid=0;
[...UNITS.filter(u=>!u.late),...UNITS.filter(u=>u.late)].forEach(u=>u.lessons.forEach((l,li)=>{
  l.id='L'+(++lid);l.unit=u;l.li=li;
  l.words=l.words.map(a=>({w:a[0],r:a[1],m:a[2],ex:a[3],exz:a[4],lesson:l}));
  l.g.lesson=l;
}));
UNITS.forEach((u,ui)=>u.ui=ui);
const LESSONS=UNITS.flatMap(u=>u.lessons);
LESSONS.forEach((l,i)=>l.n=i+1);
const WORDS=LESSONS.flatMap(l=>l.words);
const WMAP=Object.fromEntries(WORDS.map(w=>[w.w,w]));
const GRAMS=LESSONS.map(l=>l.g);

/* 读音干扰项：长音、浊音、促音的常见混淆 */
const DAK={か:'が',き:'ぎ',く:'ぐ',け:'げ',こ:'ご',さ:'ざ',し:'じ',す:'ず',せ:'ぜ',そ:'ぞ',た:'だ',て:'で',と:'ど',は:'ば',ひ:'び',ふ:'ぶ',へ:'べ',ほ:'ぼ'};
const UNDAK=Object.fromEntries(Object.entries(DAK).map(([a,b])=>[b,a]));
function readingTraps(w,r){
  let ok=0;while(ok<w.length&&ok<r.length&&w[w.length-1-ok]===r[r.length-1-ok])ok++;
  const SWAP={ち:'じ',じ:'ち',ゃ:'ょ',ょ:'ゃ',ゅ:'ょ'};
  const mut=str=>{
    const a=[...str],end=a.length-ok,out=new Set();
    const put=arr=>{const s=arr.join('');if(s&&s!==r)out.add(s)};
    for(let i=0;i<end;i++){
      const c=a[i],n=a[i+1];
      if(DAK[c])put([...a.slice(0,i),DAK[c],...a.slice(i+1)]);
      if(UNDAK[c])put([...a.slice(0,i),UNDAK[c],...a.slice(i+1)]);
      if(SWAP[c]&&!(SWAP[c]==='ゃ'&&n==='う'))put([...a.slice(0,i),SWAP[c],...a.slice(i+1)]);
      if(n==='う'&&i+1<end)put([...a.slice(0,i+1),...a.slice(i+2)]);
      else if(/[こそとのほもよろごぞどぼょゅくすつぬふむゆるぐずぶ]/.test(c)&&n!=='う'&&n!=='ゃ'&&n!=='ゅ'&&n!=='ょ')put([...a.slice(0,i+1),'う',...a.slice(i+1)]);
      if(c==='っ'){put([...a.slice(0,i),'つ',...a.slice(i+1)]);put([...a.slice(0,i),...a.slice(i+1)])}
      else if(/[くちつき]/.test(c)&&i>0&&n&&/[かきくけこさしすせそたちつてとぱぴぷぺぽ]/.test(n))put([...a.slice(0,i),'っ',...a.slice(i+1)]);
      if(n==='い'&&/[えけせてねへめれげぜでべ]/.test(c)&&i+1<end)put([...a.slice(0,i+1),...a.slice(i+2)]);
    }
    return out;
  };
  const one=mut(r);
  let list=shuffle([...one]);
  if(list.length<3)list=list.concat(shuffle([...new Set([...one].flatMap(m=>[...mut(m)]))].filter(x=>!list.includes(x))));
  if(list.length<3){
    const near=POOL.R.map(e=>e.r).filter(x=>x!==r&&!list.includes(x))
      .map(x=>[x,Math.abs(x.length-r.length)*2+(x[0]===r[0]?0:1)+Math.random()]).sort((p,q)=>p[1]-q[1]).map(p=>p[0]);
    list=list.concat(near);
  }
  return list.slice(0,3);
}

let L=null;
function buildLesson(l){
  const w=l.words,g=l.g;
  const vg=shuffle(w.filter(x=>x.ex.includes(x.w)))[0];
  const q=[{t:'card',w:w[0]},{t:'card',w:w[1]},{t:'mc',w:w[0]},{t:'card',w:w[2]},{t:'listen',w:w[1]},{t:'card',w:w[3]},
    {t:w[2].r===w[2].w||/^[ァ-ヶー]+$/.test(w[2].w)?'mc':'reading',w:w[2]},{t:'card',w:w[4]},{t:'rmc',w:w[3]},{t:'listen',w:w[4]},{t:'match',ws:w},
    {t:'tip',g},{t:'gap',g,e:g.ex[0]},{t:'gap',g,e:g.ex[1]},{t:'order',g}];

function buildReview(){

function prep(b){

  if(b.t==='rmc'){s.ans=b.w.w;s.opts=opts(s.ans,WORDS.map(x=>x.w))}
  if(b.t==='listen'){s.ans=b.w.w;s.opts=opts(s.ans,[...b.w.lesson.words,...WORDS].map(x=>x.w).slice(0,9).concat(shuffle(WORDS).slice(0,3).map(x=>x.w)))}
  if(b.t==='reading'){s.ans=b.w.r;s.opts=opts(s.ans,WORDS.map(x=>x.r))}
  if(b.t==='gap'){s.ans=b.g.k;s.opts=opts(s.ans,ALLK)}
  const x=b.x;
  if(b.t==='xr'){s.ans=x.r;s.opts=shuffle([x.r,...readingTraps(x.w,x.r)])}
  if(b.t==='xh'){s.ans=x.w;s.opts=shuffle([x.w,...x.hk])}
  if(b.t==='xk'){s.ans=x.a;s.opts=shuffle([x.a,...x.d])}
  if(b.t==='xc'){s.ans=x.w;s.opts=opts(x.w,POOL.C.filter(e=>posG(e.pos)===posG(x.pos)).map(e=>e.w))}
  if(b.t==='xp'){s.ans=x.syn;s.opts=opts(x.syn,POOL.P.map(e=>e.syn))}
  if(b.t==='xu'){s.ans=x.ex;s.opts=shuffle([x.ex,...shuffle(POOL.U.filter(e=>e!==x&&posG(e.pos)===posG(x.pos))).slice(0,3).map(e=>e.ex.replace(e.w,x.w))])}
  if(b.t==='vgap'){s.ans=b.w.w;s.opts=opts(s.ans,b.w.lesson.words.map(x=>x.w))}
  if(b.t==='order'){const n=b.g.order[1].length;let bank;do{bank=shuffle([...Array(n).keys()])}while(n>1&&bank.every((v,i)=>v===i));s.bank=bank;s.sel=[]}
  if(b.t==='match'){s.left=shuffle(b.ws);s.right=shuffle(b.ws.map(x=>x.m));s.ok=[];s.pl=null;s.pr=null;s.miss=0}

function startSession(mode,lesson,exam){

function closeSession(){L=null;$('#lx').hidden=true;$('#lx-sheet').hidden=true;document.body.style.overflow='';try{speechSynthesis.cancel()}catch(e){}render()}

function optList(s,jp,fmt=o=>o,cls=''){return `<div class="opts">${s.opts.map((o,i)=>`<button class="opt ${jp?'jp':''} ${cls}" data-opt="${i}"><span class="k num">${i+1}</span><span>${fmt(o)}</span></button>`).join('')}</div>`}

     ${sayBtn(w.w)}<div class="word"><ruby>${w.w}<rt>${w.r===w.w?'':w.r}</rt></ruby></div><div class="mean">${w.m}</div>${examChip(w.w)}

   case 'mc':return `<div class="ex"><div class="eyebrow">选择意思</div><p class="q">「<span class="jp">${w.w}</span>」是什么意思？</p>${optList(s)}</div>`;
   case 'rmc':return `<div class="ex"><div class="eyebrow">选择单词</div><p class="q">哪个词表示「${w.m}」？</p>${optList(s,true)}</div>`;

   case 'tip':{const g=s.g;return `<div class="ex"><div class="eyebrow">语法要点</div><div class="tip">

       <p class="sent">${a}<span class="blank ${s.sel==null?'empty-b':''}" id="blank">${s.sel??'＿'}</span>${b}</p>${optList(s,true)}</div>`}
   case 'order':{const p=s.g.order[1];return `<div class="ex"><div class="eyebrow">组句</div><p class="q">把词块排成正确的句子</p><p style="color:var(--muted);font-weight:700">${s.g.order[0]}</p>

function showEx(){

const zhLine=t=>`<br><span style="font-family:var(--f-ui);color:var(--muted)">${t}</span>`;

/* ---------- PWA: install, persistent storage, backup ---------- */
let installEvt=null,persisted=false;
const standalone=()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}};
function installPanel(){
  if(standalone())return `<div class="panel"><div class="eyebrow" style="margin-bottom:6px">App</div><p style="font-weight:800">已作为 App 运行</p></div>`;
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  return `<div class="panel"><div class="eyebrow" style="margin-bottom:8px">安装 App</div>
    ${installEvt?`<p style="color:var(--muted);font-size:13px;margin-bottom:12px">安装到桌面或主屏幕，离线也能学习。</p><button class="btn btn-primary" data-act="install">安装 ことば道</button>`
    :`<p style="color:var(--muted);font-size:13px">${ios?'在 Safari 中点「分享」→「添加到主屏幕」。':'在 Chrome / Edge 地址栏右侧点安装图标，或在浏览器菜单里选「安装应用」。需要通过 http://localhost 或 https 打开本页。'}</p>`}</div>`;
}
async function installApp(){if(!installEvt)return;installEvt.prompt();try{await installEvt.userChoice}catch(e){}installEvt=null;render()}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(tab==='me')render()});
window.addEventListener('appinstalled',()=>{installEvt=null;toast('已安装 ことば道');render()});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
try{navigator.storage?.persist?.().then(v=>{persisted=!!v;if(tab==='me')render()}).catch(()=>{})}catch(e){}

function exportProgress(){
  const data=JSON.stringify({app:'kotoba-n2',version:1,exported:new Date().toISOString(),state:S},null,2);
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));
  a.download=`kotoba-n2-进度-${dk(new Date())}.json`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('已导出进度文件');
}
const imp=document.createElement('input');imp.type='file';imp.accept='application/json,.json';imp.id='import-file';imp.hidden=true;document.body.appendChild(imp);
imp.addEventListener('change',async()=>{
  const f=imp.files[0];imp.value='';if(!f)return;
  try{
    const j=JSON.parse(await f.text()),st=j&&j.app==='kotoba-n2'?j.state:null;
    if(!st||typeof st!=='object'||typeof st.lessons!=='object'||typeof st.words!=='object')throw 0;
    S=Object.assign(defState(),st);save();render();toast('进度已恢复');
  }catch(e){toast('这个文件不是 ことば道 的进度备份')}
});

render();
</script>
</body>
</html>
